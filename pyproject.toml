[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "graph-generation"
version = "0.2.0"
description = "Pipeline for the 'Effects of Structure on Layout' graph corpus"
requires-python = ">=3.11"
dependencies = [
  "geg-metrics>=0.2.2",
  "networkx>=3.2",
  "numpy>=1.24",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pydot>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ogdf = ["ogdf-python>=0.5"]

[project.scripts]
pipeline = "graph_generation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_generation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: end-to-end checks that exercise generators / layouts / metrics",
]
